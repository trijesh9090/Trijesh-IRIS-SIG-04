[project]
name = "iris-bauleitplanung-harvester"
version = "0.1.0"
description = "IRIS-SIG-04: harvest Bavarian B-Plan / FNP notices into iris_staging.signal_ingest"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
